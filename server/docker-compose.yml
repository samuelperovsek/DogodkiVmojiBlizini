version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_dogodki
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: dogodki           
    ports:
      - "3306:3306"
    volumes:
      - mysql_dogodki_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_dogodki_data: