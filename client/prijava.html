<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava / Registracija — DogodkiVMojiBližini.si</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f5f3ff;">

  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-geo-alt-fill"></i>DogodkiVMojiBližini
      </a>
      <div class="ms-auto">
        <a href="index.html" class="btn btn-outline-primary">
          <i class="bi bi-arrow-left"></i> Nazaj na domov
        </a>
      </div>
    </div>
  </nav>

  <section class="section-padding">
    <div class="container">

      <div class="auth-card">

        <ul class="nav nav-pills mb-4 justify-content-center" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">
              Prijava
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#register">
              Registracija
            </button>
          </li>
        </ul>

        <div class="tab-content">

          <div class="tab-pane fade show active" id="login">
            <h2 class="text-center">Dobrodošli nazaj</h2>
            <p class="text-muted text-center mb-4">Prijavite se v svoj račun.</p>

            <div class="row g-2 mb-3">
              <div class="col-4">
                <button class="social-btn"><i class="bi bi-google"></i> Google</button>
              </div>
              <div class="col-4">
                <button class="social-btn"><i class="bi bi-facebook"></i> Facebook</button>
              </div>
              <div class="col-4">
                <button class="social-btn"><i class="bi bi-apple"></i> Apple</button>
              </div>
            </div>

            <div class="text-center text-muted mb-3">— ali z e-pošto —</div>

            <form onsubmit="event.preventDefault(); window.location='profil.html';">
              <div class="mb-3">
                <label class="form-label">E-poštni naslov</label>
                <input type="email" class="form-control" placeholder="ime@email.si" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Geslo</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember" checked>
                  <label class="form-check-label" for="remember">Zapomni si me</label>
                </div>
                <a href="#">Pozabljeno geslo?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100">Prijava</button>
            </form>

            <p class="text-center mt-3 mb-0">
              Nimate računa?
              <a href="#" onclick="document.querySelector('[data-bs-target=&quot;#register&quot;]').click(); return false;">
                Ustvarite ga
              </a>
            </p>
          </div>

          <div class="tab-pane fade" id="register">
            <h2 class="text-center">Ustvari račun</h2>
            <p class="text-muted text-center mb-4">Brezplačna registracija v dveh minutah.</p>

            <form onsubmit="event.preventDefault(); window.location='profil.html';">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Ime</label>
                  <input type="text" class="form-control" placeholder="Ana" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Priimek</label>
                  <input type="text" class="form-control" placeholder="Perovšek" required>
                </div>
              </div>

              <div class="mt-3">
                <label class="form-label">E-poštni naslov</label>
                <input type="email" class="form-control" placeholder="ime@email.si" required>
              </div>

              <div class="mt-3">
                <label class="form-label">Geslo</label>
                <input type="password" class="form-control" placeholder="Najmanj 8 znakov" required>
              </div>

              <div class="mt-3">
                <label class="form-label">Mesto bivanja</label>
                <select class="form-select" required>
                  <option value="">Izberite mesto...</option>
                  <option>Ljubljana</option>
                  <option>Maribor</option>
                  <option>Celje</option>
                  <option>Kranj</option>
                  <option>Koper</option>
                  <option>Novo mesto</option>
                  <option>Drugo</option>
                </select>
              </div>

              <div class="mt-3">
                <label class="form-label">Vaši interesi</label>
                <div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="i1" checked>
                    <label class="form-check-label" for="i1">Koncerti</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="i2">
                    <label class="form-check-label" for="i2">Sejmi</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="i3" checked>
                    <label class="form-check-label" for="i3">Delavnice</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="i4">
                    <label class="form-check-label" for="i4">Šport</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="i5" checked>
                    <label class="form-check-label" for="i5">Kultura</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="i6">
                    <label class="form-check-label" for="i6">Izobraževanja</label>
                  </div>
                </div>
              </div>

              <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label" for="terms">
                  Strinjam se s <a href="#">pogoji uporabe</a>.
                </label>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="newsletter" checked>
                <label class="form-check-label" for="newsletter">
                  Pošljite mi tedenske novice.
                </label>
              </div>

              <button type="submit" class="btn btn-primary w-100">Ustvari račun</button>
            </form>

            <p class="text-center mt-3 mb-0">
              Že imate račun?
              <a href="#" onclick="document.querySelector('[data-bs-target=&quot;#login&quot;]').click(); return false;">
                Prijavite se
              </a>
            </p>
          </div>
        </div>

      </div>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (window.location.hash === '#registracija') {
      document.querySelector('[data-bs-target="#register"]').click();
    }
  </script>
</body>
</html>
