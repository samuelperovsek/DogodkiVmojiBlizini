<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil organizatorja — Eventli.si</title>

  <script src="js/uveljavi-temo.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-geo-alt-fill"></i>Eventli
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Domov</a></li>
          <li class="nav-item"><a class="nav-link" href="dogodki.html">Dogodki</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#kategorije">Kategorije</a></li>
        </ul>
        <div data-auth-buttons class="d-flex gap-2 d-none">
          <a href="prijava.html" class="btn btn-outline-primary">Prijava</a>
          <a href="prijava.html#registracija" class="btn btn-primary">Registracija</a>
        </div>
        <div data-user-menu class="dropdown d-none">
          <button class="btn btn-outline-primary dropdown-toggle" data-dropdown-toggle>
            <i class="bi bi-person-circle"></i> <span data-user-name>…</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profil.html"><i class="bi bi-person"></i> Moj profil</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" data-logout><i class="bi bi-box-arrow-right"></i> Odjava</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <header class="page-header page-header--with-image">
    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1600&q=85&auto=format&fit=crop" alt="" aria-hidden="true" class="page-header__bg" loading="eager">
    <div class="container text-center py-4">
      <div class="d-flex flex-column align-items-center">
        <div class="profile-avatar mb-3 shadow-lg" id="orgAvatar" style="width: 100px; height: 100px; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; background-color: #0d6efd; color: white; border-radius: 50%;">…</div>
        <h1 id="orgIme" class="mb-2">Nalaganje organizatorja...</h1>
        <p class="lead mb-2 text-white/90" id="orgEmail">…</p>
        
        <div class="d-flex align-items-center gap-3 mt-2 text-white">
          <span class="bg-white/10 px-3 py-1.5 rounded-full text-sm">
            <i class="bi bi-people-fill text-warning"></i> <span id="orgSledilciCount">0</span> sledilcev
          </span>
          <button id="gumb-sledi-glavni" class="btn btn-light btn-sm font-semibold shadow-sm px-4 py-1.5" style="border-radius: 20px;">
            <i class="bi bi-plus-lg"></i> Sledi
          </button>
        </div>
      </div>
    </div>
  </header>

  <section class="section-padding bg-light">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0"><i class="bi bi-calendar-week text-primary"></i> Vsi dogodki organizatorja</h3>
        <span class="badge bg-primary fs-6" id="orgDogodkiCount">0</span>
      </div>

      <div class="row g-4" id="orgDogodkiList">
        <div class="text-center w-100 p-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted">Nalagam dogodke...</p>
        </div>
      </div>

      <div class="text-center mt-5 d-none" id="nalozi-vec-kontejner">
        <button id="gumb-nalozi-vec-dogodkov" class="btn btn-outline-primary px-5 py-2 fw-semibold shadow-sm" style="border-radius: 10px;">
          Naloži več dogodkov
        </button>
      </div>
    </div>
  </section>

  <footer class="mt-auto">
    <div class="container text-center py-4 text-muted">
      <span>© 2026 Eventli.si</span>
    </div>
  </footer>

  <script type="module" src="js/components.js"></script>
  <script src="js/dropdown.js"></script>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/page-organizator.js"></script>
</body>
</html>
